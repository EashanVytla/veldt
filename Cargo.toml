[workspace]
members = [
    "crates/veldt-core",
    "crates/veldt-index",
    "crates/veldt-scheduler",
    "crates/veldt-decode",
    "crates/veldt-reader-lerobot",
    "crates/veldt-cache",
    "crates/veldt-engine",
    "crates/veldt-cli",
    "python",
]
resolver = "2"

[workspace.dependencies]
veldt-core = { path = "crates/veldt-core" }
veldt-index = { path = "crates/veldt-index" }
veldt-scheduler = { path = "crates/veldt-scheduler" }
veldt-decode = { path = "crates/veldt-decode" }
veldt-reader-lerobot = { path = "crates/veldt-reader-lerobot" }
veldt-cache = { path = "crates/veldt-cache" }
veldt-engine = { path = "crates/veldt-engine" }

thiserror = "2"
anyhow = "1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
